<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Squares from 1 to 500</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 30px 0 10px;
      font-size: 2.5em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 1200px;
      padding: 20px;
    }

    .square-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .square-card:hover {
      transform: scale(1.05);
      background-color: rgba(255, 255, 255, 0.25);
    }

    .number {
      font-size: 1.2em;
      margin-bottom: 5px;
    }

    .result {
      font-size: 1.5em;
      font-weight: bold;
      color: #f9f871;
    }

    footer {
      margin: 20px;
      font-size: 0.9em;
      color: #ddd;
    }
  </style>
</head>
<body>
  <h1>Squares of Numbers 1 to 500</h1>
  <div class="grid" id="squareGrid"></div>

  <footer>Generated with JavaScript | Stylish Squares</footer>

  <script>
    const grid = document.getElementById('squareGrid');

    for (let i = 1; i <= 500; i++) {
      const card = document.createElement('div');
      card.className = 'square-card';

      card.innerHTML = `
        <div class="number">${i}²</div>
        <div class="result">${i * i}</div>
      `;

      grid.appendChild(card);
    }
  </script>
</body>
</html>
