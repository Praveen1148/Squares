<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Squares from 1 to 500</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 30px 0 10px;
      font-size: 2.5em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      width: 90%;
      max-width: 1200px;
      padding: 20px;
    }

    .square-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .square-card:hover {
      transform: scale(1.05);
      background-color: rgba(255, 255, 255, 0.25);
    }

    .number {
      font-size: 1.2em;
      margin-bottom: 5px;
    }

    .result {
      font-size: 1.5em;
      font-weight: bold;
      color: #f9f871;
    }

    footer {
      margin: 20px;
      font-size: 0.9em;
      color: #ddd;
    }

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-card {
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transform: scale(1.2);
      color: #fff;
    }

    .popup-overlay.hidden {
      display: none;
      backdrop-filter: none;
    }
  </style>
</head>
<body>
  <h1>Squares of Numbers 1 to 500</h1>
  <div class="grid" id="squareGrid"></div>

  <!-- Popup overlay -->
  <div class="popup-overlay hidden" id="popupOverlay">
    <div class="popup-card" id="popupCard">
      <div class="number" id="popupNumber"></div>
      <div class="result" id="popupResult"></div>
    </div>
  </div>

  <footer>Generated with JavaScript | Stylish Squares</footer>

  <script>
    const grid = document.getElementById('squareGrid');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupNumber = document.getElementById('popupNumber');
    const popupResult = document.getElementById('popupResult');

    for (let i = 1; i <= 500; i++) {
      const card = document.createElement('div');
      card.className = 'square-card';

      const square = i * i;

      card.innerHTML = `
        <div class="number">${i}²</div>
        <div class="result">${square}</div>
      `;

      card.addEventListener('click', () => {
        popupNumber.textContent = `${i}²`;
        popupResult.textContent = square;
        popupOverlay.classList.remove('hidden');
      });

      grid.appendChild(card);
    }

    // Hide popup when overlay is clicked
    popupOverlay.addEventListener('click', () => {
      popupOverlay.classList.add('hidden');
    });

    // Optional: Close popup with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        popupOverlay.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
